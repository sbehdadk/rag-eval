apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-eval
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod # if using TLS
spec:
  ingressClassName: traefik
  rules:
    - host: rag-eval.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
  # tls:  # Uncomment for HTTPS
  #   - secretName: rag-eval-tls
  #     hosts:
  #       - rag-eval.yourdomain.com
