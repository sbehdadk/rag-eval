name: CI pipeline rag-eval

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rag_eval: ${{ steps.filter.outputs.rag_eval }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rag_eval:
              - 'services/rag-eval/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/ci.yml'

  rag-eval-ci:
    name: rag-eval ci
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rag_eval == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache docker layer
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: intal uv
        uses: astral-sh/setup-uv@v4

      - name: install dependencies
        run: make pre-build

      - name: Run ruff linter
        run: uv run ruff check ./services/rag-eval

      - name: Run ruff formatter check
        run: uv run ruff format --check ./services/rag-eval

      - name: run tests
        run: uv run pytest ./services/rag-eval

      - name: run coverage
        run: uv run pytest --cov=rag_eval --cov-report=xml

      - name: check dependencies
        run: uv run pip-audit

      - name: build backend
        uses: docker/build-push-action@v5
        with:
          context: ./services/rag-eval
          file: ./services/rag-eval/Dockerfile
          #load: true
          tags: rag-eval:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./services/rag-eval
          file: ./services/rag-eval/Dockerfile
          push: true
          tags: |
            ghcr.io/sbehdadk/rag-eval:latest
            ghcr.io/sbehdadk/rag-eval:${{ github.sha }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

  frontend-ci:
    name: frontend ci
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache docker layer
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: intal uv
        uses: astral-sh/setup-uv@v4

      - name: install dependencies
        run: make pre-build

      - name: Run ruff linter
        run: uv run ruff check ./services/frontend

      - name: Run ruff formatter check
        run: uv run ruff format --check ./services/frontend

      - name: run tests
        run: |
          echo "frontend test will be included here!!!"

      - name: run coverage
        run: |
          echo "frontend coverage will be included here!!!"

      - name: check dependencies
        run: uv run pip-audit

      - name: build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          #load: true
          tags: rag-eval:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/sbehdadk/frontend:latest
            ghcr.io/sbehdadk/frontend:${{ github.sha }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

