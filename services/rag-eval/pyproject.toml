[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG Evaluation Service"
readme = "README.md"
requires-python = ">=3.10"

# All dependencies (runtime + dev) for self-contained service
dependencies = [
    "fastapi>=0.128.0",
    "openai>=2.14.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "polyfactory>=2.19.3",
    "ruff>=0.9.1",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["rag_eval/tests"]
