# Workspace configuration for local development
# Only Python services are included

[tool.uv.workspace]
members = []

# Shared dev tools for local development (not used in Docker)
[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "polyfactory>=2.19.3",
    "ruff>=0.9.1",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.1",
]

# Shared linting configuration
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
